# LabIX client list used for for automating route server config,
#   ix-f schema export, IRRDB AS-Set update and website member list
# Visit here for route server information: https://ix.labitat.dk/#route-server

clients:
  - asn: 211153
    description: "Emil Petersen"
    speed: 1000 # Mbit/s
    ip:
      - "2001:7f8:149:1ab::21:1153:1" # Assign an IPv6 address with the following format: 2001:7f8:149:1ab::<asn>:<asn>:<router-number>
    mac: "00:1e:06:45:38:09" #MAC-address for filtering and loopback prevention
    rs_peer: True
    rs_config: # Used for Arouteserver config and are compatible its configuration options.
      filtering:
        irrdb:
          as_sets:
            - "RIPE::AS211153:AS-ALL" #AS-Set is required when registering as Route Server client
                                      #Optionally prepend with IRRDB source, ex. RIPE
      16bit_mapped_asn: 64514 #RFC 6996 Private ASNs. Required for 32-bit ASNs

  - asn: 198275
    description: "Thomas Flummer"
    speed: 1000
    ip:
      - "2001:7f8:149:1ab::19:8275:1"
