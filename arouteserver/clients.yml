        #  reject_invalid: True
        #max_prefix:
        #  action: "shutdown"
        #  peering_db:
        #    enabled: True

  - asn: 198275
    description: "Thomas Flummer"
    ip:
      - "2001:7f8:149:1ab::19:8275:1"
    cfg:
      gtsm: False
      filtering:
        irrdb:
          as_sets:
            - "RIPE::AS198275:AS-ALL"
    16bit_mapped_asn: 64516

  - asn: 62113
    description: "Kracon/Svenne"
    ip:
      - "2001:7f8:149:1ab::6:2113:1"
